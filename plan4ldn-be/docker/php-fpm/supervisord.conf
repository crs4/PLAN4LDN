[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/var/www/storage/logs/laravel.log
stderr_logfile_maxbytes=30000000
exitcodes=0

[program:worker]
command=/usr/local/bin/php -d variables_order=EGPCS /var/www/artisan queue:listen --timeout=0
user=www-data
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/bin/bash /usr/local/bin/scheduler
user=www-data
environment=SLEEP_TIME_SECONDS="60"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/var/www/storage/logs/scheduler.log
stderr_logfile_maxbytes=2000
