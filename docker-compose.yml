# Common Django template for GeoNode and Celery services below
x-common-django:
  &default-common-django
  image: ${COMPOSE_PROJECT_NAME}/geonode:${GEONODE_BASE_IMAGE_VERSION}
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - statics:/mnt/volumes/statics
    - geoserver-data-dir:/geoserver_data/data
    - backup-restore:/backup_restore
    - data:/data
    - tmp:/tmp
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # SOILS GEONODE
  # Soil Catalogue - Geonode django application.
  django:
    << : *default-common-django
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-django
    healthcheck:
      test: "curl -m 10 --fail --silent --output /dev/null http://django:8000/"
      start_period: 60s
      interval: 60s
      timeout: 60s
      retries: 4
    environment:
      - IS_CELERY=False
    entrypoint: ["/usr/src/s4m_catalogue/entrypoint.sh"]
    command: "uwsgi --ini /usr/src/s4m_catalogue/uwsgi.ini"
    networks:
      - plan4ldn
  # Celery worker that executes celery tasks created by Django.
  celery:
    << : *default-common-django
    container_name: ${COMPOSE_PROJECT_NAME}-celery
    environment:
      - IS_CELERY=True
    entrypoint: ["/usr/src/s4m_catalogue/entrypoint.sh"]
    command: "celery-cmd"
    healthcheck:
      test: "celery -b ${BROKER_URL} inspect ping"
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 2
    networks:
      - plan4ldn

  # Nginx is serving django static and media files and proxies to django and geonode
  geonode:
    image: ${COMPOSE_PROJECT_NAME}/nginx:${NGINX_BASE_IMAGE_VERSION}
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${NGINX_BASE_IMAGE_VERSION}
    container_name:  ${COMPOSE_PROJECT_NAME}-main-nginx
    env_file:
      - .env
    environment:
      - RESOLVER=127.0.0.11
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - nginx-confd:/etc/nginx
      - nginx-certificates:/geonode-certificates
      - statics:/mnt/volumes/statics
    restart: unless-stopped
    healthcheck:
      test: "if ps -o pid | grep -w 1 > /dev/null; then echo 'nginx running'; else exit 1;fi"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - plan4ldn
    depends_on:
      laravel:
        condition: service_healthy  
  # Gets and installs letsencrypt certificates
  letsencrypt:
    image: ${COMPOSE_PROJECT_NAME}/letsencrypt:${LETSENCRYPT_BASE_IMAGE_VERSION}
    build:
      context: ./docker/letsencrypt
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${LETSENCRYPT_BASE_IMAGE_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-letsencrypt
    env_file:
      - .env
    volumes:
      - nginx-certificates:/geonode-certificates
    restart: unless-stopped
    networks:
      - plan4ldn
  # Geoserver backend
  geoserver:
    image: ${COMPOSE_PROJECT_NAME}/geoserver:${GEOSERVER_BASE_IMAGE_VERSION}
    build:
      context: ./docker/geoserver
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${GEOSERVER_BASE_IMAGE_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-geoserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://geoserver:8080/geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      - backup-restore:/backup_restore
      - data:/data
      - tmp:/tmp
    restart: unless-stopped
    depends_on:
      data-dir-conf:
        condition: service_healthy
      django:
        condition: service_healthy
    networks:
      - plan4ldn
  
  data-dir-conf:
    image: ${COMPOSE_PROJECT_NAME}/geoserver_data:${GEOSERVER_BASE_IMAGE_VERSION}
    build:
      context: ./docker/geoserver_data
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${GEOSERVER_BASE_IMAGE_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-gsconf
    entrypoint: sleep infinity
    volumes:
      - geoserver-data-dir:/geoserver_data/data
    restart: unless-stopped
    healthcheck:
      test: "ls -A '/geoserver_data/data' | wc -l"
    networks:
      - plan4ldn

  db:
    image: ${COMPOSE_PROJECT_NAME}/postgis:${POSTGRES_BASE_IMAGE_VERSION}
    build:
      context: ./docker/postgresql
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${POSTGRES_BASE_IMAGE_VERSION}
    command: postgres -c "max_connections=${POSTGRESQL_MAX_CONNECTIONS}"
    container_name: ${COMPOSE_PROJECT_NAME}-db
    env_file:
      - .env
    volumes:
      - dbdata:/var/lib/postgresql/data
      - dbbackups:/pg_backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plan4ldn
  
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - plan4ldn
  
  plan4ldn:
    image: ${COMPOSE_PROJECT_NAME}/node:26-alpine3.24 
    container_name: ${COMPOSE_PROJECT_NAME}-nextjs
    env_file:
      - .env
    build:
      context: ./
      dockerfile: DockerfileReact 
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - plan4ldn  

# PLAN4LDN-BE LARAVEL
  # Nginx is serving laravel static and media files and proxies laravel 
  laravel:
    build:
      context: ./plan4ldn-be
      dockerfile: ./docker/nginx/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-be-nginx
    env_file:
      - .env
    environment:
      - NGINX_HOST=localhost  
    restart: unless-stopped # Automatically restart unless the service is explicitly stopped
    ports:
      - "${NGINX_PORT:-3033}:3033"
    volumes:
      - laravel-storage-production:/var/www/storage:ro
      - laravel-public-assets:/var/www/public/build:ro
    networks:
      - plan4ldn
    depends_on:
      phpfpm:
        condition: service_started
    healthcheck:
      test: "if ps -o pid | grep -w 1 > /dev/null; then echo 'nginx running'; else exit 1;fi"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      
  # PHP-FPM laravel service
  phpfpm: 
    # For the php-fpm service, we will create a custom image to install the necessary PHP extensions and setup proper permissions.
    build:
      context: ./plan4ldn-be
      dockerfile: ./docker/php-fpm/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-be-php-fpm
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - laravel-public-assets:/var/www/public/build  # Mount built public assets to ensure the manifest.json and hashed files match between Nginx and PHP-FPM
      - laravel-storage-production:/var/www/storage  # Mount the storage volume
    # healthcheck:
    #   test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    networks:
      - plan4ldn
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  # MySql database
  mysql:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME}-be-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${DB_ALLOW_EMPTY_PASSWORD}
    volumes:
      - 'mysql:/var/lib/mysql'
    networks:
      - plan4ldn
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s

networks:
  plan4ldn:
    driver: bridge

volumes:
  statics:
    name: ${COMPOSE_PROJECT_NAME}-statics
  nginx-confd:
    name: ${COMPOSE_PROJECT_NAME}-nginxconfd
  nginx-certificates:
    name: ${COMPOSE_PROJECT_NAME}-nginxcerts
  geoserver-data-dir:
    name: ${COMPOSE_PROJECT_NAME}-gsdatadir
  dbdata:
    name: ${COMPOSE_PROJECT_NAME}-dbdata
  dbbackups:
    name: ${COMPOSE_PROJECT_NAME}-dbbackups
  backup-restore:
    name: ${COMPOSE_PROJECT_NAME}-backup-restore
  data:
    name: ${COMPOSE_PROJECT_NAME}-data
  tmp:
    name: ${COMPOSE_PROJECT_NAME}-tmp
  mysql:
    name: ${COMPOSE_PROJECT_NAME}-mysql
  redisdata:
    name: ${COMPOSE_PROJECT_NAME}-redisdata
  laravel-public-assets:
    name: ${COMPOSE_PROJECT_NAME}-laravel-public
  laravel-storage-production:
    name: ${COMPOSE_PROJECT_NAME}-laravel-storage